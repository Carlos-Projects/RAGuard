[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raguard-scanner"
version = "0.1.0"
description = "Security scanner for Retrieval-Augmented Generation (RAG) systems — detect data poisoning, membership inference, prompt leakage, and more"
authors = [
    { name = "Carlos Rocha", email = "carlos@carlosrocha.dev" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "rag-security", "llm-security", "ai-safety", "vector-db",
    "prompt-injection", "data-poisoning", "membership-inference",
    "retrieval-security", "raguard",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "numpy>=1.24",
    "mcp-taxonomy>=0.2.0",
]

[project.optional-dependencies]
chroma = ["chromadb>=0.4"]
milvus = ["pymilvus>=2.3"]
qdrant = ["qdrant-client>=1.7"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
all = [
    "raguard-scanner[chroma,milvus,qdrant,dev]",
]

[project.scripts]
raguard = "raguard.cli:app"

[project.urls]
Homepage = "https://github.com/Carlos-Projects/RAGuard"
Repository = "https://github.com/Carlos-Projects/RAGuard"
Documentation = "https://github.com/Carlos-Projects/RAGuard"
Issues = "https://github.com/Carlos-Projects/RAGuard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/raguard"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501", "B904"]

[tool.mypy]
ignore_errors = false
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.coverage.run]
source = ["raguard"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
