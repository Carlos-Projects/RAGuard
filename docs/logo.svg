<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5818c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="inner-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Shield background -->
  <path d="M64 4 L116 28 L116 60 Q116 92 64 120 Q12 92 12 60 L12 28 Z"
        fill="url(#shield-grad)" />

  <!-- Inner shield border -->
  <path d="M64 16 L104 34 L104 58 Q104 84 64 106 Q24 84 24 58 L24 34 Z"
        fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

  <!-- Database cylinder -->
  <ellipse cx="50" cy="52" rx="18" ry="8" fill="url(#inner-grad)" opacity="0.9"/>
  <rect x="32" y="52" width="36" height="16" fill="url(#inner-grad)" opacity="0.9"/>
  <ellipse cx="50" cy="68" rx="18" ry="8" fill="url(#inner-grad)" opacity="0.9"/>

  <!-- Database highlight line -->
  <line x1="38" y1="52" x2="38" y2="68" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="62" y1="52" x2="62" y2="68" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <!-- Magnifying glass handle -->
  <line x1="72" y1="72" x2="84" y2="84" stroke="white" stroke-width="4" stroke-linecap="round"/>

  <!-- Magnifying glass circle -->
  <circle cx="68" cy="60" r="14" fill="none" stroke="white" stroke-width="3.5"/>
  <circle cx="68" cy="60" r="10" fill="none" stroke="white" stroke-width="1.5" opacity="0.4"/>

  <!-- Checkmark -->
  <polyline points="44,46 50,52 58,42" fill="none" stroke="white" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>
